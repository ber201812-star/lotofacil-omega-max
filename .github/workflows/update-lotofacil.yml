name: Atualizar Lotofácil

on:
  workflow_dispatch:

  schedule:
    - cron: "17 21 * * 1-6"
      timezone: "America/Sao_Paulo"
    - cron: "47 22 * * 1-6"
      timezone: "America/Sao_Paulo"
    - cron: "17 23 * * 1-6"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Atualizar resultados
        run: |
          python update_data.py

      - name: Verificar alterações
        id: verificar
        run: |
          if git diff --quiet -- data/history.json; then
            echo "alterado=false" >> "$GITHUB_OUTPUT"
          else
            echo "alterado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gravar nova base
        if: steps.verificar.outputs.alterado == 'true'
        run: |
          git config user.name "lotofacil-omega-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git commit -m "Atualiza resultados da Lotofácil"
          git push
